name: Daily Time Report
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Connection test only: enter connection-test"
        required: true
        default: "connection-test"
        type: string
      send_feishu:
        required: true
        default: false
        type: boolean
      save_calendar:
        required: true
        default: false
        type: boolean
permissions: {}
concurrency:
  group: timemap-ssh-status-check
  cancel-in-progress: false
jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TEST_TARGET: ${{ inputs.target_date }}
      SSH_HOST: ${{ secrets.TIMEMAP_DAILY_SSH_HOST }}
      SSH_PORT: ${{ secrets.TIMEMAP_DAILY_SSH_PORT }}
      SSH_USER: ${{ secrets.TIMEMAP_DAILY_SSH_USER }}
      SSH_KEY: ${{ secrets.TIMEMAP_DAILY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.TIMEMAP_DAILY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Verify status-only SSH connection
        shell: bash
        run: |
          set -euo pipefail
          test "$TEST_TARGET" = "connection-test"
          for n in SSH_HOST SSH_PORT SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            test -n "${!n}"
          done
          T=$(mktemp -d "$RUNNER_TEMP/timemap-ssh.XXXXXX")
          trap 'rm -rf -- "$T"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$T/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$T/known_hosts"
          timeout 45s ssh -F /dev/null -i "$T/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$T/known_hosts" \
            -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" status > "$T/result.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v.get("service")=="timemap-daily-link" and v.get("mode")=="status_only" and v.get("business_execution_enabled") is False; print("SSH_CONNECTION_TEST_OK"); print("BUSINESS_EXECUTION_ENABLED=false")' "$T/result.json"
