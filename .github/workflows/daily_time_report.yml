{
  "name": "Daily Time Report",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "operation": {
          "description": "check 只检查连接；run 生成日报并写入 Notion",
          "required": true,
          "default": "check",
          "type": "choice",
          "options": [
            "check",
            "run"
          ]
        },
        "target_date": {
          "description": "日报日期 YYYY-MM-DD；留空处理昨天",
          "required": false,
          "default": "",
          "type": "string"
        },
        "send_feishu": {
          "description": "是否发送飞书报告",
          "required": true,
          "default": false,
          "type": "boolean"
        },
        "save_calendar": {
          "description": "是否提交并发布周历数据",
          "required": true,
          "default": false,
          "type": "boolean"
        }
      }
    },
    "schedule": [
      {
        "cron": "43 5 * * *",
        "timezone": "Asia/Singapore"
      }
    ]
  },
  "permissions": {
    "contents": "write",
    "pages": "write",
    "id-token": "write"
  },
  "concurrency": {
    "group": "daily-time-report",
    "cancel-in-progress": false
  },
  "jobs": {
    "run-daily-report": {
      "if": "github.ref == format('refs/heads/{0}', github.event.repository.default_branch)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "outputs": {
        "pages_ready": "${{ steps.upload.outcome == 'success' }}"
      },
      "env": {
        "TIMEMAP_DAILY_SSH_HOST": "${{ secrets.TIMEMAP_DAILY_SSH_HOST }}",
        "TIMEMAP_DAILY_SSH_PORT": "${{ secrets.TIMEMAP_DAILY_SSH_PORT }}",
        "TIMEMAP_DAILY_SSH_USER": "${{ secrets.TIMEMAP_DAILY_SSH_USER }}",
        "TIMEMAP_DAILY_SSH_KEY": "${{ secrets.TIMEMAP_DAILY_SSH_KEY }}",
        "TIMEMAP_DAILY_SSH_KNOWN_HOSTS": "${{ secrets.TIMEMAP_DAILY_SSH_KNOWN_HOSTS }}",
        "FEISHU_WEBHOOK_URL": "${{ secrets.FEISHU_WEBHOOK_URL }}",
        "DAILY_TARGET_DATE": "${{ inputs.target_date }}",
        "DAILY_SEND_FEISHU": "${{ github.event_name == 'schedule' || inputs.send_feishu }}"
      },
      "steps": [
        {
          "name": "Checkout main",
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ github.event.repository.default_branch }}"
          }
        },
        {
          "name": "Python",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Check connection",
          "if": "github.event_name == 'workflow_dispatch' && inputs.operation == 'check'",
          "run": "python .github/scripts/timemap_daily_client.py status"
        },
        {
          "name": "Compute report",
          "id": "daily",
          "if": "github.event_name == 'schedule' || inputs.operation == 'run'",
          "run": "python .github/scripts/timemap_daily_client.py fetch"
        },
        {
          "name": "Commit calendar",
          "if": "steps.daily.outcome == 'success' && (github.event_name == 'schedule' || inputs.save_calendar)",
          "env": {
            "DEFAULT_BRANCH": "${{ github.event.repository.default_branch }}"
          },
          "run": "git fetch origin \"$DEFAULT_BRANCH\"\ntest \"$(git rev-parse HEAD)\" = \"$(git rev-parse \"origin/$DEFAULT_BRANCH\")\"\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add data/life_calendar_daily.json web/data/life_calendar.json\nif ! git diff --cached --quiet; then\n  git commit -m \"Update Life Calendar data\"\n  git push origin \"HEAD:$DEFAULT_BRANCH\"\nfi"
        },
        {
          "name": "Deliver report once",
          "id": "send_report",
          "if": "steps.daily.outcome == 'success'",
          "continue-on-error": true,
          "run": "python .github/scripts/timemap_daily_client.py send"
        },
        {
          "name": "Configure Pages",
          "if": "steps.daily.outcome == 'success' && (github.event_name == 'schedule' || inputs.save_calendar)",
          "uses": "actions/configure-pages@v5"
        },
        {
          "name": "Upload calendar",
          "id": "upload",
          "if": "steps.daily.outcome == 'success' && (github.event_name == 'schedule' || inputs.save_calendar)",
          "uses": "actions/upload-pages-artifact@v4",
          "with": {
            "path": "web"
          }
        },
        {
          "name": "Check delivery",
          "if": "steps.send_report.outcome == 'failure'",
          "run": "exit 1"
        }
      ]
    },
    "deploy-pages": {
      "if": "${{ always() && !cancelled() && needs.run-daily-report.outputs.pages_ready == 'true' }}",
      "needs": "run-daily-report",
      "runs-on": "ubuntu-latest",
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "name": "Deploy calendar",
          "id": "deployment",
          "uses": "actions/deploy-pages@v4"
        }
      ]
    }
  }
}
